<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="terminal">
            <div class="terminal-header">
                <div class="terminal-title">
                    <span class="blink">█</span> CHRONOS ADMIN TERMINAL <span class="blink">█</span>
                </div>
                <div class="terminal-close" onclick="terminate()">
                    <i class="fas fa-power-off"></i>
                </div>
            </div>
            
            <div class="terminal-body">
                <div class="sidebar">
                    <div class="module active" onclick="loadModule('players')" id="mod-players">
                        <div class="module-icon"><i class="fas fa-users-cog"></i></div>
                        <div class="module-name">PLAYERS</div>
                        <div class="module-status">ONLINE</div>
                    </div>
                    
                    <div class="module" onclick="loadModule('arsenal')" id="mod-arsenal">
                        <div class="module-icon"><i class="fas fa-rocket"></i></div>
                        <div class="module-name">ARSENAL</div>
                        <div class="module-status">READY</div>
                    </div>
                    
                    <div class="module" onclick="loadModule('security')" id="mod-security">
                        <div class="module-icon"><i class="fas fa-shield-virus"></i></div>
                        <div class="module-name">SECURITY</div>
                        <div class="module-status">ACTIVE</div>
                    </div>
                </div>
                
                <div class="main-display">
                    <div id="players-module" class="display-module active">
                        <div class="scan-line"></div>
                        <div class="module-header">
                            <h2>PLAYER SURVEILLANCE SYSTEM</h2>
                            <div class="search-terminal">
                                <input type="text" placeholder="SEARCH TARGET..." id="playerSearch" onkeyup="scanTargets()">
                                <i class="fas fa-search"></i>
                            </div>
                        </div>
                        <div class="targets-grid" id="targetsGrid"></div>
                    </div>
                    
                    <div id="arsenal-module" class="display-module">
                        <div class="scan-line"></div>
                        <div class="module-header">
                            <h2>ADMIN ARSENAL</h2>
                        </div>
                        <div class="weapons-grid">
                            <div class="weapon" onclick="deployWeapon('noclip')">
                                <div class="weapon-icon"><i class="fas fa-ghost"></i></div>
                                <div class="weapon-name">GHOST MODE</div>
                                <div class="weapon-desc">Phase through matter</div>
                            </div>
                            <div class="weapon" onclick="deployWeapon('nomi')">
                                <div class="weapon-icon"><i class="fas fa-radar-dish"></i></div>
                                <div class="weapon-name">RADAR SCAN</div>
                                <div class="weapon-desc">Detect all entities</div>
                            </div>
                            <div class="weapon" onclick="deployWeapon('godmod')">
                                <div class="weapon-icon"><i class="fas fa-infinity"></i></div>
                                <div class="weapon-name">IMMORTAL</div>
                                <div class="weapon-desc">Invincibility shield</div>
                            </div>
                            <div class="weapon" onclick="deployWeapon('invisibile')">
                                <div class="weapon-icon"><i class="fas fa-eye-slash"></i></div>
                                <div class="weapon-name">STEALTH</div>
                                <div class="weapon-desc">Optical camouflage</div>
                            </div>
                            <div class="weapon" onclick="deployWeapon('ripara')">
                                <div class="weapon-icon"><i class="fas fa-tools"></i></div>
                                <div class="weapon-name">NANO REPAIR</div>
                                <div class="weapon-desc">Instant vehicle fix</div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="security-module" class="display-module">
                        <div class="scan-line"></div>
                        <div class="module-header">
                            <h2>SECURITY PROTOCOLS</h2>
                        </div>
                        <div class="threats-list" id="threatsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
